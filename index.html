<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3B4664">
    <meta name="description" content="A modern responsive calculator with three themes.">
    <title>Calc — Modern Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-theme="theme-1">
    <main class="calculator-app">
        <div class="calculator-shell">
            <header class="calculator-header">
                <h1 class="brand">calc</h1>

                <div class="theme-control">
                    <span class="theme-label">THEME</span>
                    <div class="theme-selector">
                        <div class="theme-numbers" aria-hidden="true">
                            <span>1</span>
                            <span>2</span>
                            <span>3</span>
                        </div>

                        <button
                            class="theme-switcher"
                            id="themeSwitcher"
                            type="button"
                            aria-label="Change calculator theme"
                            aria-valuemin="1"
                            aria-valuemax="3"
                            aria-valuenow="1"
                        >
                            <span class="theme-ball"></span>
                        </button>
                    </div>
                </div>
            </header>

            <section class="screen" aria-label="Calculator display">
                <div class="expression" id="expression" aria-live="polite"></div>
                <input
                    id="calcInput"
                    class="calc-input"
                    type="text"
                    inputmode="decimal"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Calculator expression"
                    placeholder="0"
                    readonly
                >
            </section>

            <section class="keypad" aria-label="Calculator keypad">
                <button class="key key-number" data-value="7">7</button>
                <button class="key key-number" data-value="8">8</button>
                <button class="key key-number" data-value="9">9</button>
                <button class="key key-action key-delete" data-action="delete">DEL</button>

                <button class="key key-number" data-value="4">4</button>
                <button class="key key-number" data-value="5">5</button>
                <button class="key key-number" data-value="6">6</button>
                <button class="key key-operator" data-value="+">+</button>

                <button class="key key-number" data-value="1">1</button>
                <button class="key key-number" data-value="2">2</button>
                <button class="key key-number" data-value="3">3</button>
                <button class="key key-operator" data-value="-">−</button>

                <button class="key key-number" data-value=".">.</button>
                <button class="key key-number" data-value="0">0</button>
                <button class="key key-operator" data-value="/">÷</button>
                <button class="key key-operator" data-value="*">×</button>

                <button class="key key-action key-reset" data-action="reset">RESET</button>
                <button class="key key-equal" data-action="calculate">=</button>
            </section>

            <p class="keyboard-hint">Keyboard supported · ESC to reset · Backspace to delete</p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
